services:
  - type: web
    name: churnrescue-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTED_DEMO
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: ALLOW_GLOBAL_RESET
        value: "0"
      - key: SQLITE_PATH
        value: /tmp/data.db
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
